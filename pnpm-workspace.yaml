# pnpm-workspace.yaml — frontend 단독 repo 설정
#
# 이 repo 는 단독 패키지라 `packages` 목록은 필요 없어요.
# 여기서 꼭 필요한 건 **allowBuilds** 하나입니다.
#
# ⚠️ 이 블록을 지우면 `pnpm install` 이 아래 에러로 실패해요:
#     ERR_PNPM_IGNORED_BUILDS
#   네이티브 바이너리를 빌드해야 하는 패키지들이라
#   설치 시 스크립트 실행을 허용해 줘야 합니다.
#
# ⚠️ pnpm 12 부터는 package.json 의 `pnpm` 필드를 읽지 않아요.
#   그래서 이 파일(pnpm-workspace.yaml)에 적어야 동작합니다. (결정 D-45)
allowBuilds:
  # ── Next.js 빌드 체인 ──
  '@swc/core': true
  esbuild: true
  unrs-resolver: true
  # ── 불필요(원격 분석 텔레메트리) ──
  '@scarf/scarf': false
