# .github/workflows/deploy.yml — GCP Cloud Run 수동 배포 (프론트 단독 repo)
#
# ─────────────────────────────────────────────────────────────
#  ⚠️ 이 워크플로는 **예비(수동) 배포 경로**입니다.
#     공식 자동 배포는 **Cloud Build + cloudbuild.yaml** 가 담당해요.
#     (main push → 자동 빌드·배포, 그리고 배포 주소가 repo 안에서 버전 관리돼요)
#     이 워크플로는 ① Cloud Build 가 막혔을 때 ② 지금 당장 수동으로 배포할 때
#     ③ 스키마 마이그레이션까지 함께 돌릴 때 사용합니다.
#     어느 쪽이든 배포 전에 CI를 먼저 통과합니다 (`needs: ci`).
# ─────────────────────────────────────────────────────────────
#
#  Variables (Settings → Secrets and variables → Actions → Variables)
#    GCP_PROJECT_ID
#    GCP_REGION                      예) asia-northeast2
#    GCP_ARTIFACT_REPOSITORY         예) docthru
#    GCP_SERVICE_ACCOUNT             예) docthru-deployer@PROJECT.iam.gserviceaccount.com
#    GCP_WORKLOAD_IDENTITY_PROVIDER  예) projects/123/.../providers/github-repo
#    CLIENT_BASE_URL                 이 서비스의 공개 주소 (NEXT_PUBLIC_SITE_URL 로 박힌다)
#    BACKEND_BASE_URL                백엔드 Cloud Run URL + /api/v1 (프록시 대상)
#
#  ⚠️ service account JSON 키는 넣지 않는다. WIF 로 키 없이 인증한다.
#  ⚠️ FE 는 DB 가 없어서 Secret 이 필요 없다.
name: Deploy

on:
  # ⚠️ Variables 등록을 마치면 아래 주석을 해제하세요.
  # push:
  #   branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # WIF 토큰 요청에 필요

jobs:
  ci:
    name: CI 검증
    # 수동 배포와 (나중에 켤) push 자동배포 모두 CI를 먼저 통과한다.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: 프론트엔드 배포
    # CI가 초록불일 때만 배포한다.
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: docker/setup-buildx-action@v3

      - name: Artifact Registry 로그인
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: 이미지 빌드 · 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.CLIENT_BASE_URL }}
            # ⚠️ rewrite 주소는 **빌드 시점에** 박힙니다. 실행 시 env 로는 안 바뀌어요.
            BACKEND_BASE_URL=${{ vars.BACKEND_BASE_URL }}

      - name: Cloud Run 배포
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: docthru
          image: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/frontend:${{ github.sha }}
          region: ${{ vars.GCP_REGION }}
          # ⚠️ 무료 티어인데 상한을 걸어야 유입 시 과금이 막힌다
          max_instances: 3
          min_instances: 0
          timeout: 300
          cpu: 1
          memory: 512Mi
          env_vars: |
            NODE_ENV=production
            BACKEND_BASE_URL=${{ vars.BACKEND_BASE_URL }}

      - name: 배포 결과 출력
        run: |
          echo "프론트 URL: ${{ steps.deploy.outputs.url }}"
          echo "→ GitHub 변수 CLIENT_BASE_URL 에 이 주소를 등록하세요 (백엔드 CORS 허용 대상)."
