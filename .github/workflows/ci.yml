# .github/workflows/ci.yml — 검증 (비밀값 필요 없음)
#
# 동작 시점: pull_request · docthru 브랜치 push · Deploy 워크플로의 호출(workflow_call)
# FE 는 DB 가 필요 없어서 postgres 서비스를 띄우지 않는다.
name: CI

on:
  pull_request:
  push:
    branches: [docthru]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pnpm-lock.yaml 이 저장소에 있으므로 frozen 으로 정확히 재현한다.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # NEXT_PUBLIC_* 는 빌드 시점에 박히므로 여기서 값을 준다.
      - name: Build
        env:
          BACKEND_BASE_URL: http://localhost:5010/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: pnpm build

      # 이미지 자체가 올라가는지 확인한다 (배포 실패를 미리 잡는 용도)
      #   Dockerfile 이 BuildKit 문법(`RUN --mount=type=cache`)을 쓰므로 명시해 둔다.
      - name: Build image
        env:
          DOCKER_BUILDKIT: '1'
        run: docker build -t docthru-frontend:ci .
